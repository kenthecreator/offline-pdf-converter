name: Regression tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  regression:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        if: runner.os == 'Windows'
        with:
          python-version: '3.12'
      - name: Run PDF and file safety regression tests
        run: dotnet run --project tests/RegressionTests -c Release -p:PaddleOcrEdition=false
      - name: Publish Windows standalone executable
        if: runner.os == 'Windows'
        run: dotnet publish src/OfflinePDFConverter/OfflinePDFConverter.csproj -p:PaddleOcrEdition=true -p:PublishProfile=WindowsSingleFile -o artifacts/standalone
      - name: Verify standalone OCR without installed dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/verify-windows-single-exe.ps1 -ExePath artifacts/standalone/OfflinePDFConverter.PaddleEdition.exe
      - name: Verify OCR models and native CRT DLLs are embedded in the exe
        if: runner.os == 'Windows'
        run: python scripts/verify-published-exe.py artifacts/standalone
      - name: Verify first OCR run with application network access blocked
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/verify-windows-single-exe.ps1 -ExePath artifacts/standalone/OfflinePDFConverter.PaddleEdition.exe -BlockNetwork -ReportPath artifacts/network-blocked-selftest.json
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: Windows-offline-standalone-candidate
          path: |
            artifacts/standalone/*.exe
            artifacts/network-blocked-selftest.json
          if-no-files-found: error
