name: Replace v4.4 packages once
on:
  push:
    paths:
      - '.github/workflows/replace-v44-once.yml'
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: windows
          - os: macos-14
            target: mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9156f5389b249dfdef107b2007f53854659a3700
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install fonttools==4.61.1
      - run: python scripts/prepare-ocr-font.py
      - run: python scripts/build-paddle-edition.py --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: replacement-${{ matrix.target }}
          path: dist/paddle-edition/*.zip
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: replacement-*
          path: candidate
          merge-multiple: true
      - name: Replace existing v4.4 ZIPs and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir public-assets
          for target in Windows-x64 macOS-arm64; do
            source="candidate/Offline PDF Converter (v4.4)-$target.zip"
            test -f "$source"
            name="Offline.PDF.Converter.v4.4.-$target.zip"
            cp "$source" "public-assets/$name"
            (cd public-assets && sha256sum "$name" > "$name.sha256.txt")
          done
          gh release upload v4.4.0 public-assets/* --clobber
