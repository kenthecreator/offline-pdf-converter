name: Compare the v5.5 Windows settings panels
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-2022:
    name: Windows Server 2022 (${{ matrix.variant }})
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: before
            commit: 1737593d7dc690073647c1ff383c0cedc30ebe85
          - variant: after
            commit: 60238630be15fee9351bd12ac9772c2705baf422
    env:
      PACKAGE_TITLE: Offline PDF Converter (v5.5)
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.commit }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare the pinned dependencies
        run: |
          python -m pip install fonttools==4.61.1
          python scripts/prepare-ocr-font.py
      - name: Build and verify the Windows single-exe distribution
        run: |
          python scripts/verify-v5.5-release.py
          python scripts/build-paddle-edition.py --target windows
          python scripts/verify-v5.5-release.py --archives dist/paddle-edition --target Windows-x64
      - name: Test the packaged exe with networking blocked and take GUI snapshots
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath "dist/paddle-edition/${env:PACKAGE_TITLE}-Windows-x64.zip" -DestinationPath isolated
          $exe = "isolated/$env:PACKAGE_TITLE.exe"
          ./scripts/verify-windows-single-exe.ps1 -ExePath $exe -BlockNetwork -ReportPath reports/windows2022-features.json
          ./scripts/verify-windows-single-exe.ps1 -ExePath $exe -BlockNetwork -VerifyGui -ReportPath reports/windows2022-gui.json
          if (@(Get-ChildItem reports -Filter 'windows2022-gui.settings-*.png').Count -ne 4) {
            throw 'Expected four settings panel screenshots.'
          }
      - uses: actions/upload-artifact@v4
        with:
          name: v5.5-windows-${{ matrix.variant }}-evidence
          path: reports/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: matrix.variant == 'after'
        with:
          name: v5.5-windows-candidate
          path: |
            dist/paddle-edition/*.zip
            dist/paddle-edition/*.sha256.txt
          if-no-files-found: error

  windows-2025:
    needs: windows-2022
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 60238630be15fee9351bd12ac9772c2705baf422
      - uses: actions/download-artifact@v4
        with:
          name: v5.5-windows-candidate
          path: candidate
      - name: Test the same Windows ZIP with networking blocked
        shell: pwsh
        run: |
          $archive = @(Get-ChildItem candidate -Recurse -Filter '*.zip')
          if ($archive.Count -ne 1) { throw 'Expected one Windows release archive.' }
          Expand-Archive -LiteralPath $archive[0].FullName -DestinationPath isolated
          $exe = 'isolated/Offline PDF Converter (v5.5).exe'
          ./scripts/verify-windows-single-exe.ps1 -ExePath $exe -BlockNetwork -ReportPath reports/windows2025-features.json
          ./scripts/verify-windows-single-exe.ps1 -ExePath $exe -BlockNetwork -VerifyGui -ReportPath reports/windows2025-gui.json
          if (@(Get-ChildItem reports -Filter 'windows2025-gui.settings-*.png').Count -ne 4) {
            throw 'Expected four settings panel screenshots.'
          }
      - uses: actions/upload-artifact@v4
        with:
          name: v5.5-windows-candidate-2025-evidence
          path: reports/
          if-no-files-found: error
