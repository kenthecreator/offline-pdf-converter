name: Build v4.2 distribution
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: windows
          - os: macos-14
            target: mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build bundled OCR distribution
        run: python scripts/build-paddle-edition.py --target ${{ matrix.target }}
      - name: Verify Windows standalone OCR
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/verify-windows-single-exe.ps1 -ExePath 'dist/paddle-edition/windows-x64/Offline PDF Converter (v4.2).exe'
      - uses: actions/upload-artifact@v4
        with:
          name: Offline-PDF-Converter-v4.2-${{ matrix.target }}
          path: |
            dist/paddle-edition/*.zip
            dist/paddle-edition/*.sha256.txt
          if-no-files-found: error
